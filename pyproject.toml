[project]
name = "engineering-harness"
version = "0.1.0"
description = "Canonical skills, rules, workflows and personas for AI-assisted engineering, composed per profile and task."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.21",
]

[project.scripts]
harness = "harness.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "skills-ref",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["TOOLS/harness"]

[tool.pytest.ini_options]
testpaths = ["TESTS"]
